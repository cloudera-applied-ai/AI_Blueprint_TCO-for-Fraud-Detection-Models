  <rect x="176" y="226" width="500" height="96" rx="10" fill="#fdf3ec" stroke="#e0b394" stroke-width="1.5"/>
  <text x="190" y="246" font-size="12" font-weight="700" fill="#232f3e">Cloudera AI — Fraud Analyst App + ReAct Agent (Application)</text>

  <rect x="188" y="258" width="112" height="52" rx="7" fill="#ffffff" stroke="#e0b394"/>
  <text x="244" y="278" text-anchor="middle" font-size="11" font-weight="600" fill="#232f3e">Score · explain</text>
