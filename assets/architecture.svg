  <text x="453" y="152" text-anchor="middle" font-size="10" fill="#5f6b7a">Apache Iceberg on Ozone / S3</text>
  <text x="453" y="168" text-anchor="middle" font-size="10" fill="#5f6b7a">+ Operational DB key lookups</text>

  <rect x="556" y="112" width="174" height="74" rx="8" fill="#eef3f8" stroke="#8aa2b8"/>
  <text x="643" y="134" text-anchor="middle" font-size="11" font-weight="700" fill="#232f3e">Cloudera Data Engineering</text>
  <text x="643" y="152" text-anchor="middle" font-size="10" fill="#5f6b7a">Spark + RAPIDS Accelerator</text>
  <text x="643" y="168" text-anchor="middle" font-size="10" fill="#5f6b7a">velocity · risk-signal features</text>

  <rect x="746" y="112" width="174" height="74" rx="8" fill="#eef3f8" stroke="#8aa2b8"/>
  <text x="833" y="134" text-anchor="middle" font-size="11" font-weight="700" fill="#232f3e">CML Jobs · Model Registry</text>
