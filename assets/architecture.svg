  <text x="263" y="168" text-anchor="middle" font-size="10" fill="#5f6b7a">Kafka · CDC · REST → land</text>

  <rect x="366" y="112" width="174" height="74" rx="8" fill="#eef3f8" stroke="#8aa2b8"/>
