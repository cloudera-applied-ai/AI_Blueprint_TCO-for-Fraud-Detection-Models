  <text x="688" y="456" text-anchor="middle" font-size="11" fill="#5f6b7a">Demo today → Cloudera: generator → DataFlow · SQLite → Iceberg + COD</text>
  <text x="688" y="471" text-anchor="middle" font-size="11" fill="#5f6b7a">pandas → CDE · train script → CML Jobs · agent → AI Studio</text>
  <text x="688" y="486" text-anchor="middle" font-size="11" fill="#5f6b7a">Dashed orange = model lifecycle: retrain → register → deploy</text>
</svg>
