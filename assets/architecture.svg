  <text x="84" y="104" text-anchor="middle" font-size="10" font-weight="700" fill="#5f6b7a" letter-spacing="1">SOURCES</text>
  <rect x="24" y="112" width="120" height="48" rx="8" fill="#ffffff" stroke="#8aa2b8"/>
  <text x="84" y="132" text-anchor="middle" font-size="11" font-weight="600" fill="#232f3e">Card / POS</text>
  <text x="84" y="148" text-anchor="middle" font-size="10" fill="#5f6b7a">auth events</text>
  <rect x="24" y="168" width="120" height="48" rx="8" fill="#ffffff" stroke="#8aa2b8"/>
  <text x="84" y="188" text-anchor="middle" font-size="11" font-weight="600" fill="#232f3e">Payment gateways</text>
  <text x="84" y="204" text-anchor="middle" font-size="10" fill="#5f6b7a">REST · Kafka</text>
  <rect x="24" y="224" width="120" height="48" rx="8" fill="#ffffff" stroke="#8aa2b8"/>
  <text x="84" y="244" text-anchor="middle" font-size="11" font-weight="600" fill="#232f3e">Core banking DBs</text>
  <text x="84" y="260" text-anchor="middle" font-size="10" fill="#5f6b7a">CDC · JDBC</text>
