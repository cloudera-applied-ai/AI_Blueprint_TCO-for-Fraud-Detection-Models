  <text x="366" y="278" text-anchor="middle" font-size="11" font-weight="600" fill="#232f3e">Investigate</text>
  <text x="366" y="295" text-anchor="middle" font-size="10" fill="#5f6b7a">merchant · network</text>
  <rect x="432" y="258" width="112" height="52" rx="7" fill="#ffffff" stroke="#e0b394"/>
  <text x="488" y="278" text-anchor="middle" font-size="11" font-weight="600" fill="#232f3e">Tune response</text>
  <text x="488" y="295" text-anchor="middle" font-size="10" fill="#5f6b7a">threshold · cost</text>
  <rect x="554" y="258" width="112" height="52" rx="7" fill="#ffffff" stroke="#e0b394"/>
  <text x="610" y="278" text-anchor="middle" font-size="11" font-weight="600" fill="#232f3e">Retrain</text>
  <text x="610" y="295" text-anchor="middle" font-size="10" fill="#5f6b7a">label corrections</text>

  <line x1="300" y1="284" x2="308" y2="284" stroke="#5f6b7a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="422" y1="284" x2="430" y2="284" stroke="#5f6b7a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="544" y1="284" x2="552" y2="284" stroke="#5f6b7a" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="700" y="226" width="220" height="96" rx="10" fill="#eef3f8" stroke="#8aa2b8"/>
  <text x="810" y="248" text-anchor="middle" font-size="12" font-weight="700" fill="#232f3e">Cloudera AI Inference</text>
  <text x="810" y="266" text-anchor="middle" font-size="10" fill="#5f6b7a">NVIDIA NIM · auto-scaling REST</text>
  <text x="810" y="282" text-anchor="middle" font-size="10" fill="#5f6b7a">XGBoost endpoint + agent LLM</text>
  <text x="810" y="298" text-anchor="middle" font-size="10" fill="#5f6b7a">Model Monitoring: drift · latency</text>
  <line x1="676" y1="274" x2="696" y2="274" stroke="#f96702" stroke-width="1.8" marker-end="url(#arrowO)"/>

  <!-- Lakehouse → app, app → training, registry → inference -->
  <line x1="420" y1="186" x2="420" y2="222" stroke="#5f6b7a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="432" y="209" font-size="10" fill="#5f6b7a">query transactions</text>
  <polyline points="640,226 640,206 770,206 770,190" fill="none" stroke="#f96702" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrowO)"/>
  <text x="652" y="198" font-size="10" fill="#f96702">retrain job</text>
  <line x1="860" y1="186" x2="860" y2="222" stroke="#f96702" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrowO)"/>
  <text x="872" y="209" font-size="10" fill="#f96702">deploy</text>

  <!-- SDX -->
  <rect x="176" y="346" width="744" height="40" rx="8" fill="#eef3f8" stroke="#8aa2b8"/>
  <text x="548" y="370" text-anchor="middle" font-size="11" fill="#232f3e"><tspan font-weight="700">SDX</tspan> — Atlas: lineage · Ranger: fine-grained ACLs · Knox: perimeter · Data Catalog · audit</text>
  <line x1="760" y1="322" x2="760" y2="342" stroke="#f96702" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrowO)"/>
