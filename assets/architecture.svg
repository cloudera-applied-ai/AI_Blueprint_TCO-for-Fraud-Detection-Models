  <text x="176" y="84" font-size="14" font-weight="700" fill="#f96702">Cloudera Data Platform — on-prem or public cloud (CPU or NVIDIA GPU)</text>

  <!-- Data + model pipeline row -->
  <text x="176" y="104" font-size="10" font-weight="700" fill="#5f6b7a" letter-spacing="1">DATA &amp; MODEL PIPELINE — INGEST, FEATURES, TRAINING</text>

