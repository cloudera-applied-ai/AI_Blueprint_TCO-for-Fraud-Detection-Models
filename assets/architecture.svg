  <text x="296" y="480" text-anchor="middle" font-size="11" fill="#5f6b7a">triage alerts · ask the agent</text>
  <line x1="296" y1="438" x2="296" y2="326" stroke="#f96702" stroke-width="1.8" marker-end="url(#arrowO)"/>

  <!-- Footer -->
